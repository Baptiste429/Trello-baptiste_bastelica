<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trello</title>
  <link rel="stylesheet" href="style.css">
 
</head>
<body>

  <header>
    <img src="trello.png" alt="Logo Trello" class="logo">
  </header>

  <main>
    <div class="conteneur-cartes" id="conteneur-cartes">
      <div class="colonne">
        <h3>À Faire</h3>
        <div class="cartes"></div>
        <button class="bouton-ajout" onclick="ouvrirModal('À Faire')">Ajouter une carte</button>
      </div>
      <div class="colonne">
        <h3>En Cours</h3>
        <div class="cartes"></div>
        <button class="bouton-ajout" onclick="ouvrirModal('En Cours')">Ajouter une carte</button>
      </div>
      <div class="colonne">
        <h3>Terminé</h3>
        <div class="cartes"></div>
        <button class="bouton-ajout" onclick="ouvrirModal('Terminé')">Ajouter une carte</button>
      </div>
    </div>
  </main>

  <div class="modal" id="modal">
    <div class="contenu-modal">
      <h3>Ajouter une carte</h3>
      <input type="text" id="titre-carte" placeholder="Titre">
      <textarea id="description-carte" placeholder="Description"></textarea>
      <button class="bouton-ajout" onclick="ajouterCarte()">Ajouter</button>
      <button class="bouton-ajout" onclick="fermerModal()">Annuler</button>
    </div>
  </div>

  <script>
    let colonneActuelle = '';

    function ouvrirModal(colonne) {
      colonneActuelle = colonne;
      document.getElementById('modal').style.display = 'flex';
    }

    function fermerModal() {
      document.getElementById('modal').style.display = 'none';
      document.getElementById('titre-carte').value = '';
      document.getElementById('description-carte').value = '';
    }

    function ajouterCarte() {
      const titre = document.getElementById('titre-carte').value;
      const description = document.getElementById('description-carte').value;

      if (titre && description) {
        const colonne = Array.from(document.querySelectorAll('.colonne h3'))
          .find(h3 => h3.textContent === colonneActuelle).parentElement;
        const conteneurCartes = colonne.querySelector('.cartes');

        const carte = document.createElement('div');
        carte.className = 'carte';
        carte.innerHTML = `<p><strong>${titre}</strong></p><p>${description}</p><button onclick="supprimerCarte(this)">Supprimer</button>`;
        conteneurCartes.appendChild(carte);

        fermerModal();
      }
    }

    function supprimerCarte(bouton) {
      bouton.parentElement.remove();
    }
  </script>
</body>
</html>
